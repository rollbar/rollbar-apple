# Device IDs: every week, lists the Apple device identifiers (iPhone19,1,
# Watch7,12, RealityDevice17,1 and so on) and their names that the newest
# Xcode on GitHub's macOS runners knows, from Xcode's own device_traits.db.
#
# Why: Rollbar's backend names devices from a map in rollbar/mox
# (mox/lib/ios_map.py), generated by mox/scripts/ios/devicemap.sh from
# Xcode's device_traits.db. A new device is only in the newest Xcode, often
# a beta that maintainers don't have installed. GitHub's runner images do
# (the xcode-27 image knows the 2026 iPhones), so the list is made here and
# the map is regenerated from it in mox.
#
# Contract with Pome, Rollbar's maintainer agent for this repository, which
# reads this workflow's runs to say when new identifiers appear. Change these
# only together with Pome:
#   - The job name, "Device IDs on <image>".
#   - One log line per device, exactly "device-id: <identifier> | <name>",
#     deduplicated by identifier across platforms and sorted by the
#     identifier's letter prefix, then its numbers numerically. An identifier
#     with two different names fails the job before any of these lines.
#   - Then one count line, exactly
#     "device-ids: <count> from Xcode <version> (<build>) on <image>".
#   Each of those is a whole line, everything after the timestamp in the raw
#   job log, so match it from there: GitHub echoes the step's script earlier
#   in the same log, and the script holds both prefixes in mid-line.
#
# Contract with mox, whose devicemap.sh --from reads the list. Change it only
# together with devicemap.sh. Each job uploads "device-ids.tsv" as the
# artifact "device-ids-<image>":
#   - UTF-8 text. Lines starting with "#" are comments, and the first line is
#     "# Xcode <version> (<build>) on <image>".
#   - Every other line is <platform> TAB <identifier> TAB <name>:
#       platform    the directory holding that device_traits.db, without
#                   ".platform" (iPhoneOS, AppleTVOS, WatchOS, XROS).
#       identifier  the Devices table's ProductType, cut at the first "-"
#                   ("iPad14,3-A" is "iPad14,3"; the suffix is an app
#                   thinning variant).
#       name        the Devices table's ProductDescription.
#   - One line per distinct (platform, identifier, name). An empty identifier
#     or name, or a TAB or a line break in one, fails the job instead.
#
# Both contracts hold only for runs on master that the schedule or a person
# started (events schedule and workflow_dispatch), for example from
# "gh run list --workflow device-ids.yml --branch master --event schedule".
# Pome, and whoever feeds devicemap.sh --from, take no other run. A
# pull_request run runs the pull request's own copy of this file, maybe a
# fork's that prints or uploads anything, and GitHub files a fork's run under
# the fork's branch name, which can be master too. So filter on the event,
# not only the branch. Such a run only shows a change to this file working.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. If the Monday runs stop, re-enable the
# workflow from the Actions tab.

name: Device IDs

on:
  schedule:
    # Mondays at 08:30 UTC, before Pome's Monday digest.
    - cron: "30 8 * * 1"
  workflow_dispatch:
  # Runs on the pull request that adds or changes this file, so a change is
  # seen working before it merges. That is safe for pull requests from forks
  # too: the job uses no secrets, only reads, and checks nothing out. What
  # such a run prints and uploads is the pull request's, so Pome and mox
  # ignore it (see the header).
  pull_request:
    paths:
      - .github/workflows/device-ids.yml

permissions:
  contents: read

defaults:
  run:
    # An explicit bash runs with -eo pipefail; the implicit default does not.
    shell: bash

jobs:
  device-ids:
    # Pome parses this name. Keep it "Device IDs on <image>".
    name: Device IDs on ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Standard labels, free for public repositories. xcode-27 is GitHub's
        # preview image for Xcode 27. Add the next image here when GitHub
        # publishes one.
        image: [macos-26, xcode-27]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      # Betas count, because a newer beta knows newer devices. Versions
      # compare numerically, component by component (26.10 is newer than
      # 26.9). Installs of the same version are its betas, release candidate
      # and release. One whose name doesn't say beta wins, since it came
      # later (September's new iPhones usually first appear in a release
      # candidate). After that the higher build wins (sort -V, so a later
      # beta beats an earlier one and a release beats its release candidate),
      # and then the real path in byte order.
      - name: Find the newest Xcode
        id: xcode
        run: |
          # Byte order for the glob and sort.
          export LC_ALL=C
          tab="$(printf '\t')"
          # version, beta (0 or 1), build and real path, one install per line.
          candidates="$(mktemp)"
          seen="|"
          for app in /Applications/Xcode*.app; do
            # The images add symlinks next to each install (Xcode.app for the
            # default, Xcode_26.6.0.app, Xcode_27.2.app). Skip them, and
            # compare real paths so no Xcode is listed twice.
            if [ -L "$app" ] || [ ! -d "$app" ]; then
              continue
            fi
            real="$(realpath "$app")"
            case "$seen" in
              *"|$real|"*) continue ;;
            esac
            seen="$seen$real|"
            if ! version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$real/Contents/Info.plist")" \
              || ! build="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$real/Contents/version.plist")"; then
              echo "::warning::Skipping $real: its version or build could not be read"
              continue
            fi
            # The fields are compared and written as tab-separated lines, so
            # each one is checked for its shape first.
            if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] \
              || ! [[ "$build" =~ ^[0-9A-Za-z]+$ ]] \
              || [[ "$real" == *[$'\t\n\r']* ]]; then
              echo "::warning::Skipping $real: unexpected path, version \"$version\" or build \"$build\""
              continue
            fi
            case "$(basename "$real")" in
              *[Bb][Ee][Tt][Aa]*) beta=1 ;;
              *) beta=0 ;;
            esac
            echo "Found Xcode $version ($build) at $real"
            printf '%s\t%s\t%s\t%s\n' "$version" "$beta" "$build" "$real" >> "$candidates"
          done

          if [ ! -s "$candidates" ]; then
            echo "::error::No Xcode found in /Applications"
            exit 1
          fi

          sorted="$(mktemp)"
          sort -t "$tab" -k1,1Vr -k2,2n -k3,3Vr -k4,4 "$candidates" > "$sorted"
          IFS="$tab" read -r version beta build app < "$sorted"
          echo "Newest: Xcode $version ($build) at $app"
          {
            echo "app=$app"
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - name: List device IDs
        env:
          IMAGE: ${{ matrix.image }}
          # Selects the Xcode for anything that asks for one, without
          # xcode-select (which needs sudo and changes the whole machine).
          DEVELOPER_DIR: ${{ steps.xcode.outputs.app }}/Contents/Developer
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          XCODE_BUILD: ${{ steps.xcode.outputs.build }}
        run: |
          # Byte order everywhere: the glob, sort and uniq.
          export LC_ALL=C
          tab="$(printf '\t')"
          out=device-ids.tsv

          for name in IMAGE DEVELOPER_DIR XCODE_VERSION XCODE_BUILD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done
          platforms="$DEVELOPER_DIR/Platforms"
          if [ ! -d "$platforms" ]; then
            echo "::error::$platforms does not exist"
            exit 1
          fi

          # platform, identifier and name, one line per database row.
          rows="$(mktemp)"
          found=0
          for db in "$platforms"/*.platform/usr/standalone/device_traits.db; do
            if [ ! -f "$db" ]; then
              continue
            fi
            found=$((found + 1))
            platform="$(basename "$(dirname "$(dirname "$(dirname "$db")")")" .platform)"
            if [[ "$platform" == *[$'\t\n\r']* ]]; then
              echo "::error::The platform directory of $db has a tab or a line break in its name"
              exit 1
            fi

            columns="$(sqlite3 -readonly -batch -init /dev/null "$db" "SELECT name FROM pragma_table_info('Devices')")"
            if ! grep -qx ProductType <<< "$columns"; then
              echo "::error::$db has no Devices table with a ProductType column"
              exit 1
            fi
            column=ProductType
            if ! grep -qx ProductDescription <<< "$columns"; then
              echo "::error::$db has no ProductDescription column in its Devices table"
              exit 1
            fi
            echo "Reading $column from $db"

            # The identifier is cut at its first "-", which starts an app
            # thinning variant ("iPad14,3-A").
            cte="WITH device AS (
              SELECT $column AS raw, ProductDescription AS name,
                CASE WHEN instr($column, '-') > 0
                  THEN substr($column, 1, instr($column, '-') - 1)
                  ELSE $column END AS identifier
              FROM Devices)"

            # Each value becomes a TSV field, so a missing one, or one with a
            # tab or a line break, would write a broken list.
            bad="$(sqlite3 -readonly -batch -init /dev/null "$db" "$cte
              SELECT quote(raw) || ', ' || quote(name) FROM device
              WHERE trim(coalesce(identifier, '')) = ''
                OR trim(coalesce(name, '')) = ''
                OR instr(identifier || name, char(9)) > 0
                OR instr(identifier || name, char(10)) > 0
                OR instr(identifier || name, char(13)) > 0")"
            if [ -n "$bad" ]; then
              while IFS= read -r row; do
                echo "::error::$db has a device with an empty identifier or name, or a tab or line break in one: $row"
              done <<< "$bad"
              exit 1
            fi

            sqlite3 -readonly -batch -init /dev/null -separator "$tab" "$db" \
              "$cte SELECT identifier, name FROM device" \
              | PLATFORM="$platform" awk -F "$tab" -v OFS="$tab" '{ print ENVIRON["PLATFORM"], $1, $2 }' \
              >> "$rows"
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No device_traits.db under $platforms"
            exit 1
          fi

          # Puts an identifier's letter prefix and its two numbers in front of
          # the line, so iPhone9,1 sorts before iPhone10,1. f is the number
          # of the identifier's field.
          key='{
            prefix = $f
            sub(/[0-9].*$/, "", prefix)
            split(substr($f, length(prefix) + 1), n, /[^0-9]+/)
            print prefix, n[1] + 0, n[2] + 0, $0
          }'

          # The list, by platform and then identifier.
          {
            echo "# Xcode $XCODE_VERSION ($XCODE_BUILD) on $IMAGE"
            echo "# platform, identifier and name, tab-separated, from rollbar/rollbar-apple's .github/workflows/device-ids.yml"
            sort -u "$rows" \
              | awk -F "$tab" -v OFS="$tab" -v f=2 "$key" \
              | sort -t "$tab" -k4,4 -k1,1 -k2,2n -k3,3n -k5,5 -k6,6 \
              | cut -f 4-
          } > "$out"

          # identifier and name, one line per distinct pair, sorted by
          # identifier, so an identifier with two names has adjacent lines.
          devices="$(mktemp)"
          cut -f 2,3 "$rows" \
            | sort -u \
            | awk -F "$tab" -v OFS="$tab" -v f=1 "$key" \
            | sort -t "$tab" -k1,1 -k2,2n -k3,3n -k4,4 -k5,5 \
            | cut -f 4- > "$devices"

          count="$(cut -f 1 "$devices" | uniq | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo "::error::No device identifiers in any device_traits.db under $platforms"
            exit 1
          fi
          conflicts="$(cut -f 1 "$devices" | uniq -d)"
          if [ -n "$conflicts" ]; then
            while IFS= read -r identifier; do
              names="$(ID="$identifier" awk -F "$tab" '$1 == ENVIRON["ID"] { printf "%s\"%s\"", sep, $2; sep = ", " }' "$devices")"
              echo "::error::$identifier has more than one name: $names"
            done <<< "$conflicts"
            exit 1
          fi

          # Pome reads these lines. Keep their format.
          awk -F "$tab" '{ print "device-id: " $1 " | " $2 }' "$devices"
          echo "device-ids: $count from Xcode $XCODE_VERSION ($XCODE_BUILD) on $IMAGE"

          {
            echo "### Device IDs from Xcode $XCODE_VERSION ($XCODE_BUILD) on $IMAGE"
            echo
            echo "$count device identifiers, from $DEVELOPER_DIR."
            echo
            echo "<details>"
            echo "<summary>The list</summary>"
            echo
            echo "| Identifier | Name |"
            echo "| --- | --- |"
            awk -F "$tab" '{
              for (i = 1; i <= 2; i++) {
                gsub(/&/, "\\&amp;", $i)
                gsub(/</, "\\&lt;", $i)
                gsub(/>/, "\\&gt;", $i)
                gsub(/\|/, "\\|", $i)
              }
              print "| " $1 " | " $2 " |"
            }' "$devices"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the list
        uses: actions/upload-artifact@v4
        with:
          name: device-ids-${{ matrix.image }}
          path: device-ids.tsv
          if-no-files-found: error
          retention-days: 90
